<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compendio Creazione Personaggio D&D</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
</head>
<body>

  <header>
    <h1>🛡️ Creazione Personaggio</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Cerca elemento (es. Elfo, Guerriero, Allineamento)...">
    </div>
    <div class="filters">
      <select id="categoryFilter">
        <option value="">Tutte le Categorie</option>
        <option value="razza">Razze / Specie</option>
        <option value="classe">Classi</option>
        <option value="sottoclasse">Sotto-classi</option>
        <option value="background">Background / Origini</option>
        <option value="talento">Talenti</option>
        <option value="equipaggiamento">Equipaggiamento</option>
      </select>
    </div>
  </header>

  <main id="cardsContainer">
    <!-- Le schede verranno caricate dinamicamente da app.js -->
  </main>

  <script src="app.js"></script>
</body>
</html>
