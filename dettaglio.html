<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dettaglio Classe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #34495e;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    .spell-level {
      background-color: #e67e22;
      color: white;
      font-size: 0.6em;
      padding: 3px 8px;
      border-radius: 4px;
      vertical-align: middle;
    }
    /* Tabella */
    .progression-table-container {
      overflow-x: auto;
      margin-top: 25px;
    }
    table.progression-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table.progression-table th, table.progression-table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    table.progression-table th {
      background-color: #2c3e50;
      color: white;
    }
    table.progression-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    /* Privilegi di Classe */
    .class-features {
      margin-top: 35px;
    }
    .feature-card {
      background: #f8f9fa;
      border-left: 4px solid #e67e22;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .feature-card h3 {
      margin-top: 0;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">← Torna alla lista</a>
    <div id="detailContent">
      <p style="text-align:center;">Caricamento dettagli...</p>
    </div>
  </div>

  <script src="dettaglio.js"></script>
</body>
</html>
